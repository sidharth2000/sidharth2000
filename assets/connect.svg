<defs>
  <filter id="soft" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="0.8"/>
  </filter>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00F5FF"/>
    <stop offset="0.5" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#FF2BD6"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00F5FF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#00F5FF" stop-opacity="1"/>
    <stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#B026FF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#B026FF" stop-opacity="0.7"/>
    <stop offset="1" stop-color="#B026FF" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="orbC"><stop offset="0" stop-color="#00F5FF" stop-opacity="0.35"/><stop offset="1" stop-color="#00F5FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="orbP"><stop offset="0" stop-color="#B026FF" stop-opacity="0.45"/><stop offset="1" stop-color="#B026FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="orbM"><stop offset="0" stop-color="#FF2BD6" stop-opacity="0.30"/><stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/></radialGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D1117"/>
    <stop offset="0.55" stop-color="#150d2e"/>
    <stop offset="1" stop-color="#06222b"/>
  </linearGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.07"/>
  </pattern>
</defs>

